id: swe_10
domain: software engineering - agent tool execution
objective: |-
  Design a tool-call executor that validates and runs tool invocations emitted by an LLM agent against a fixed registry of four local tools, so that a malformed or runaway call can never crash or stall the agent loop.

  Interface contract for the implementation (solution.py):
  solution.py must define exactly one public function: execute(call, registry) -> dict.
  - call is a dict {"tool": <str>, "args": <dict>}.
  - registry is a dict mapping tool name -> {"fn": callable, "idempotent": bool, "timeout_s": float};
    fn is called as fn(**args). The registry must hold exactly four tools: execute rejects any
    registry with a different number of tools without invoking anything.
  - The result is a dict with at least the keys status, output, attempts.
    status is one of "ok", "error", "timeout", "rejected".
  - rejected: registry without exactly four tools, unknown tool, call not a dict, missing or
    non-dict args, or non-string tool name.
    A rejected call never invokes any tool function; attempts is 0.
  - ok: output is fn's return value; attempts counts invocations (1 when the first call succeeds).
  - error: fn raised; output is the error message string. A tool marked idempotent is retried at
    most 2 more times (attempts <= 3); a non-idempotent tool is never retried (attempts == 1).
  - timeout: fn did not return within timeout_s; reported as a result, never raised; no retry.
  - execute must never raise for any of the inputs above.
hard_constraints:
- the executor must expose exactly one public function, execute(call, registry), that takes one tool-call
  dict and returns one result dict
- the registry must hold exactly four tools; execute must reject a registry that does not, and must reject
  a call naming any tool outside the registry, without executing anything
- must use only the Python standard library; no eval, exec, or dynamic code loading
- every tool invocation must be bounded by a per-call timeout of at most 5 seconds, and a timeout must
  be reported as a result, not raised as an exception
- a failing tool may be retried at most 2 times, and only when the registry marks that tool as idempotent
- the result dict must always contain the keys status, output, and attempts, with status one of ok, error,
  timeout, rejected
- total implementation must remain under 250 lines of Python excluding tests and comments
success_criteria:
- specifies the validation steps applied to a call before any tool code runs, and the error reported for
  each failure
- states how the timeout is enforced without leaving a runaway tool holding the executor
- describes a deterministic test showing that a rejected call never invokes a tool
plausible_directions:
- run each tool in a worker thread and join with a timeout, reporting a timeout result when the join expires
- validate arguments against a per-tool schema dict in the registry before dispatch, then call the function
  directly
- wrap dispatch in a small result builder that maps every exception class to an error result carrying
  the attempt count
banned_moves:
- add a sandbox, container, or subprocess isolation layer for tool execution
- introduce an async runtime or a thread-pool service shared across agents
- add a circuit breaker, rate limiter, or telemetry beyond the result dict
- extend the public API with registration, hook, or middleware functions
