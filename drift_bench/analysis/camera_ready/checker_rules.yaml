# Checker rules for the deterministically checkable hard constraints.
# Hand-written (2026-10-26). One entry per hard constraint, in brief order.
# `classifier_type` / `classifier_checkable` come from checkers.classify_constraint;
# `checker_type` / `checkable` are the labels used by the runtime.
# `label_source` is `manual_override` where the hand label differs from the classifier.
# Clause fields: kind (count|budget|duration|quantity|frequency|year_range|clock_range|dims),
# comparator (min|max|exact|range), limit or low/high, noun / units / unit regexes, scope,
# group_noun (per_group scopes), context (regex that must match within context_window chars of the
# mention, default 60), context_after (regex on the 30 chars after the mention), exclude_before /
# exclude_after / exclude_after_values (regexes on the 25 chars around the mention), prefix (regex
# before the number that stands in for a unit), context_before (regex on the 35 chars before), allow_n (accept 'N = 150'), ignore_cmp (threshold
# constraints: the stated number counts regardless of 'fewer than' or 'at least'), values_only,
# strict (cap wording 'under' / 'fewer than': equality violates), noun_number_adjacent ('set size 4'),
# units (duration unit families the clause accepts), var (variable name for 'a < z < b').
# subset_words (count clauses: a number preceded by one of these words sizes a subset, not the total;
# default training|train|validation|calibration|discovery|replication|tuning|development|dev|held-out|hold-out).
# Budget clauses: an amount equal to the cap that names the budget ('a budget of £X', '£X budget') is a
# restated bound. Count and duration clauses carry a comparator across 'and' onto a bare second number.
# Runtime rules: the alternatives-not-chosen section is removed first; for minimum constraints on
# counts and durations, and for budgets, the largest stated value is taken as the total; conflicting
# verdicts give undetermined; equality satisfies a cap unless strict. Only concrete stated values
# and ranges decide; restated bounds give undetermined (restatement_only) with a bound_verdict.
# checker_type threshold_restatement marks the ignore_cmp constraints: the checker only tests whether
# the stated threshold number matches the brief, so they are excluded from the agreement tables.
