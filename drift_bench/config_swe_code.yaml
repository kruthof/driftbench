# Phase C (executable arm) config for the extended SWE pilot (plan item E6).
# Copy of config.yaml with ONE change: subject max_tokens raised from 4096 to
# 8192. The code-output templates (drift_bench/prompts_swe_code/) ask for a
# full solution.py plus the six prose sections; Gemini Pro's research final
# turns already average 2,300 to 2,800 tokens, so 4096 would truncate the
# code and the harness would report no_code. Judge, auditor, probe, pricing
# and rate limits are unchanged. swe_verify.py reads this file to compute the
# `truncated` column (token_count >= max_tokens).
models:
  subjects:
    # Frontier tier
    - id: "openai/gpt-5.4"
      provider: openai
      max_tokens: 8192
      temperature: 0.7
    - id: "anthropic/claude-sonnet-4-6"
      provider: anthropic
      max_tokens: 8192
      temperature: 0.7
    - id: "gemini/gemini-3.1-pro-preview"
      provider: google
      max_tokens: 8192
      temperature: 1.0  # Gemini 3 models require temp=1.0 per litellm warning
    # Mid-tier
    - id: "openai/gpt-5.4-mini"
      provider: openai
      max_tokens: 8192
      temperature: 0.7
    - id: "gemini/gemini-3.1-flash-lite-preview"
      provider: google
      max_tokens: 8192
      temperature: 1.0  # Gemini 3 models require temp=1.0 per litellm warning

  judges:
    default: "anthropic/claude-opus-4-6"
    for_anthropic_runs: "openai/gpt-5.4"
    temperature: 0.0
    max_tokens: 2048

  auditor:
    id: "openai/gpt-5.4"
    temperature: 0.0
    max_tokens: 4096

experiment:
  conditions:
    - single_shot
    - multi_turn_neutral
    - multi_turn_pressure
    - checkpointed_pressure
  repetitions: 2
  checkpoint_after_turns: [2, 4]
  restatement_probe: true
  # max_tokens for the restatement probe call. The April 2026 runs used 1024
  # (it was hard-coded in runners/multi_turn.py). Keep 1024 for new main runs;
  # runners/reprobe.py overrides it per invocation with --probe-max-tokens.
  probe_max_tokens: 1024
  brief_reinjection_subset_size: 8

rate_limits:
  openai:
    requests_per_minute: 60
    tokens_per_minute: 800000
  anthropic:
    requests_per_minute: 60
    tokens_per_minute: 800000
  google:
    requests_per_minute: 2000
    tokens_per_minute: 8000000

# Per-token USD prices used ONLY as a fallback for the budget cap when
# litellm.completion_cost returns 0 (gpt-5.4-mini did so on all 304 published
# runs). Copied from litellm.model_cost (local map, litellm 1.83.8). They are
# not used for any reported cost figure.
pricing:
  "anthropic/claude-opus-4-6":
    input_cost_per_token: 5.0e-06
    output_cost_per_token: 2.5e-05
  "openai/gpt-5.4":
    input_cost_per_token: 2.5e-06
    output_cost_per_token: 1.5e-05
  "openai/gpt-5.4-mini":
    input_cost_per_token: 7.5e-07
    output_cost_per_token: 4.5e-06
  "gemini/gemini-3.1-pro-preview":
    input_cost_per_token: 2.0e-06
    output_cost_per_token: 1.2e-05
  "gemini/gemini-3.1-flash-lite-preview":
    input_cost_per_token: 2.5e-07
    output_cost_per_token: 1.5e-06

budget:
  max_usd: 600.0

paths:
  briefs: "briefs/"
  prompts: "prompts/"
  transcripts: "data/transcripts/"
  scores: "data/scores/"
  aggregated: "data/aggregated/"
